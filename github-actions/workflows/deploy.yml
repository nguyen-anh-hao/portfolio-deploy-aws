# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Deploy Workflow — chạy khi merge/push vào main                     ║
# ║  Copy file này sang repo React: .github/workflows/deploy.yml        ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  Required GitHub Secrets (Settings → Secrets → Actions):            ║
# ║    AWS_ACCESS_KEY_ID          — từ: terraform output cicd_access_key_id   ║
# ║    AWS_SECRET_ACCESS_KEY      — từ: terraform output -raw cicd_secret_access_key ║
# ║    S3_BUCKET_NAME             — từ: terraform output s3_bucket_name  ║
# ║    CLOUDFRONT_DISTRIBUTION_ID — từ: terraform output cloudfront_distribution_id ║
# ║    AWS_REGION                 — vd: ap-southeast-1                   ║
# ║                                                                      ║
# ║  Optional GitHub Variables (Settings → Variables → Actions):         ║
# ║    BUILD_DIR   = dist (Vite) hoặc build (CRA) — default: dist       ║
# ╚══════════════════════════════════════════════════════════════════════╝

name: Deploy to AWS

on:
  push:
    branches:
      - main
  # Cho phép trigger thủ công từ GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production # Requires manual approval if configured

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install & Build ───────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          CI: true
          # Uncomment and set your build-time environment variables:
          # VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}

      # ── 4. Configure AWS Credentials ─────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── 5. Deploy to S3 ──────────────────────────────────────────────────────
      # Strategy:
      #   - Hashed assets (main.abc123.js): cache 1 year (immutable)
      #   - index.html: no cache (always fresh — React entry point)
      #   - --delete: remove old files not in new build

      - name: Deploy static assets to S3 (long cache)
        env:
          BUILD_DIR: ${{ vars.BUILD_DIR || 'dist' }}
        run: |
          # Upload all files EXCEPT index.html with long-term cache
          aws s3 sync "$BUILD_DIR/" "s3://${{ secrets.S3_BUCKET_NAME }}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE

      - name: Deploy index.html to S3 (no cache)
        env:
          BUILD_DIR: ${{ vars.BUILD_DIR || 'dist' }}
        run: |
          # Upload index.html without cache so users always get the latest version
          aws s3 cp "$BUILD_DIR/index.html" "s3://${{ secrets.S3_BUCKET_NAME }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      # ── 6. Invalidate CloudFront Cache ───────────────────────────────────────
      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "CloudFront invalidation created: $INVALIDATION_ID"
          echo "App is live at: https://$(aws cloudfront get-distribution \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'Distribution.DomainName' --output text)"
